# Copy this file to local.properties and fill in the paths for your machine.
# local.properties is gitignored; do not commit it.
#
# Paths are NOT hardcoded or discovered relative to this project. You choose
# where the Android SDK and the ATAK SDK live on your filesystem here (or set the
# same keys in gradle.properties). The build fails with a clear message if a path
# is missing or wrong.

# Android SDK (required).
sdk.dir=<path to your Android SDK>

# ATAK SDK directory (required for offline builds). Must contain main.jar and
# atak-gradle-takdev.jar. The build resolves the takdev jar from here, and takdev
# resolves main.jar from here.
sdk.path=<path to your ATAK SDK, e.g. /path/to/ATAK-CIV-5.6.0-SDK>

# Optional: override only the takdev gradle jar (defaults to
# <sdk.path>/atak-gradle-takdev.jar).
#takdev.plugin=<path to atak-gradle-takdev.jar>

# Optional: build against a TAK Maven repo instead of the offline SDK. When
# takrepo.url is set, sdk.path is not required.
#takrepo.url=https://artifacts.tak.gov/artifactory/maven
#takrepo.user=<username>
#takrepo.password=<password>

# Optional: pin the version code to make bisecting easier.
#takStaticVersion=1001
